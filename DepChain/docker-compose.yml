services:
  server1:
    image: depchain:latest
    container_name: depchain_member1
    networks:
      - depchain_net

  server2:
    image: depchain:latest
    container_name: depchain_member2
    networks:
      - depchain_net

  server3:
    image: depchain:latest
    container_name: depchain_member3
    networks:
      - depchain_net

  server4:
    image: depchain:latest
    container_name: depchain_member4
    networks:
      - depchain_net

  client1:
    image: depchain:latest
    container_name: depchain_client1
    networks:
      - depchain_net
    depends_on:
      - server1
      - server2
      - server3
      - server4

networks:
  depchain_net:
    driver: bridge